name: deploy-web

on:
  push:
    branches: [dev, main]
    paths:
      - "apps/web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run build

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN != '' && vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Deploy through SSM
        env:
          BRANCH: ${{ github.ref_name }}
          INSTANCE_ID: ${{ vars.INSTANCE_ID }}
        run: |
          CMD="sudo -u ubuntu bash -lc 'cd /home/ubuntu/rituai-platform && git fetch origin && git reset --hard origin/$BRANCH && cd apps/web && npm ci && npm run build && pm2 restart rituai-web'"
          PARAMS=$(jq -n --arg c "$CMD" '{commands:[$c]}')

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMS" \
            --query "Command.CommandId" --output text)

          FAILED=""
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || FAILED=1

          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}"

          [ -z "$FAILED" ]
